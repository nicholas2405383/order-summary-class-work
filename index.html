<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Summary</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="phone">
    <section class="card">
      <div class="hero">
        <img src="assets/dancer.jpg" class="dancer">
      </div>


      <h1>Order Summary</h1>
      <p class="blurb">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>


      <div class="plan">
        <div class="icon">&#9835;</div>
        <div class="info">
          <strong>Annual Plan</strong>
          <span>$59.99/year</span>
        </div>
        <a href="#" class="change">Change</a>
      </div>

      
      <button class="pay">Proceed to Payment</button>
      <a href="#" class="cancel">Cancel Order</a>
    </section>
  </main>
</body>
</html>
